[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pll-python"
version = "0.1.0"
description = "exact rational pacing and clock following"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/Version2beta/pll-python"
Documentation = "https://github.com/Version2beta/pll-python#readme"
Issues = "https://github.com/Version2beta/pll-python/issues"

[project.scripts]
pllpace = "pll.pllpace:main"

[tool.setuptools]
packages = ["pll"]
include-package-data = false
